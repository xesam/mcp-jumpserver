[mcp_servers.mcp-jumpserver]
command = "node"
args = ["../dist/index.js"]

[mcp_servers.mcp-jumpserver.env]
MCP_JUMPSERVER_CONFIG = "mcp-jumpserver.yaml"

[mcp_servers.mcp-jumpserver.tools.connect]
approval_mode = "approve"

[mcp_servers.mcp-jumpserver.tools.send_input]
approval_mode = "approve"

[mcp_servers.mcp-jumpserver.tools.confirm_shell]
approval_mode = "approve"

[mcp_servers.mcp-jumpserver.tools.execute]
approval_mode = "approve"
